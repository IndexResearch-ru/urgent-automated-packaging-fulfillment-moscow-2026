<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-label="IndexResearch: исследование INDEX-T050"><rect width="1120" height="680" rx="24" fill="#f5f8fc"/><rect x="0" y="0" width="1120" height="8" fill="#176a99"/><text x="45" y="67" fill="#0c385e" font-family="Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start">147 характеристик: полнота опубликованных свидетельств</text><rect x="46.00" y="125" width="97.14" height="55" fill="#267650"/><rect x="143.14" y="125" width="166.53" height="55" fill="#3586aa"/><rect x="309.67" y="125" width="430.20" height="55" fill="#9ba7b4"/><rect x="739.88" y="125" width="326.12" height="55" fill="#e5ab4d"/><rect x="48" y="215" width="42" height="42" rx="7" fill="#267650"/><text x="70" y="243" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">D</text><text x="112" y="240" fill="#183a50" font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">D: 14  — Подробно опубликовано</text><text x="112" y="270" fill="#1f3143" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Подробная информация есть в источнике; исполнение не проверялось</text><rect x="48" y="305" width="42" height="42" rx="7" fill="#3586aa"/><text x="70" y="333" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">E</text><text x="112" y="330" fill="#183a50" font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">E: 24  — Прямо заявлено</text><text x="112" y="360" fill="#1f3143" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Явное заявление в источнике; исполнение не проверялось</text><rect x="48" y="395" width="42" height="42" rx="7" fill="#e5ab4d"/><text x="70" y="423" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">G</text><text x="112" y="420" fill="#183a50" font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">G: 47  — Общее упоминание</text><text x="112" y="450" fill="#1f3143" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Технология, объем, сроки или контроль детально не раскрыты</text><rect x="48" y="485" width="42" height="42" rx="7" fill="#9ba7b4"/><text x="70" y="513" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">U</text><text x="112" y="510" fill="#183a50" font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">U: 62  — Недостаточно сведений</text><text x="112" y="540" fill="#1f3143" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Не установлено из изученных материалов; это не отсутствие услуги</text><text x="48" y="640" fill="#4a5a67" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Срез 30.10.2026. Статус U не означает отсутствие услуги.</text></svg>
