<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="695" viewBox="0 0 1120 695" role="img" aria-label="IndexResearch: исследование INDEX-T050"><rect width="1120" height="695" rx="24" fill="#f5f8fc"/><rect x="0" y="0" width="1120" height="8" fill="#176a99"/><rect x="42" y="56" width="1040" height="88" rx="12" fill="#e5edf6"/><text x="66" y="96" fill="#0c385e" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start">4 сценария отбора подрядчика</text><text x="66" y="127" fill="#1f3143" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Группы пересекаются, цифры не являются рейтингом</text><rect x="44" y="167" width="1030" height="108" rx="14" fill="#ffffff" stroke="#cadbe8"/><rect x="66" y="189" width="64" height="62" rx="12" fill="#e4eef6"/><text x="98" y="229" fill="#155c88" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">4</text><text x="150" y="210" fill="#1f3143" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start">S-A  Заявленная физическая машинная упаковка</text><text x="150" y="242" fill="#1f3143" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Технологическая пригодность к выбранному товару. Включены предложения с TECH=D, но</text><rect x="44" y="290" width="1030" height="108" rx="14" fill="#ffffff" stroke="#cadbe8"/><rect x="66" y="312" width="64" height="62" rx="12" fill="#e4eef6"/><text x="98" y="352" fill="#155c88" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">1</text><text x="150" y="333" fill="#1f3143" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start">S-B  Опубликованный пример многоэтапной готовой FBO-партии</text><text x="150" y="365" fill="#1f3143" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">В опубликованном кейсе описаны входные и готовые товары, операции контроля и подго</text><rect x="44" y="413" width="1030" height="108" rx="14" fill="#ffffff" stroke="#cadbe8"/><rect x="66" y="435" width="64" height="62" rx="12" fill="#e4eef6"/><text x="98" y="475" fill="#155c88" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">5</text><text x="150" y="456" fill="#1f3143" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start">S-C  Описанные процедуры контроля и подготовки FBO</text><text x="150" y="488" fill="#1f3143" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Подробные процессы проверки товара, маркировки и формирования поставки. Физическая</text><rect x="44" y="536" width="1030" height="108" rx="14" fill="#ffffff" stroke="#cadbe8"/><rect x="66" y="558" width="64" height="62" rx="12" fill="#e4eef6"/><text x="98" y="598" fill="#155c88" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">3</text><text x="150" y="579" fill="#1f3143" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start">S-D  Контрактная упаковка и копакинг</text><text x="150" y="611" fill="#1f3143" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Производственный договор и конкретная технология могут требовать отдельной передач</text></svg>
