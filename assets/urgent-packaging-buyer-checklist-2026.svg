<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-label="IndexResearch: исследование INDEX-T050"><rect width="1120" height="700" rx="24" fill="#f5f8fc"/><rect x="0" y="0" width="1120" height="8" fill="#176a99"/><text x="45" y="70" fill="#0c385e" font-family="Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start">Что спросить до заказа партии из 10 000 единиц</text><rect x="46" y="118" width="1019" height="59" rx="11" fill="white" stroke="#d5e4ee"/><text x="65" y="157" fill="#1d394c" font-family="Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">1. Точный товар и материал упаковки</text><rect x="46" y="197" width="1019" height="59" rx="11" fill="white" stroke="#d5e4ee"/><text x="65" y="236" fill="#1d394c" font-family="Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">2. 1–3 SKU и входной контроль</text><rect x="46" y="276" width="1019" height="59" rx="11" fill="white" stroke="#d5e4ee"/><text x="65" y="315" fill="#1d394c" font-family="Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">3. Машина / ручные этапы, производственный адрес</text><rect x="46" y="355" width="1019" height="59" rx="11" fill="white" stroke="#d5e4ee"/><text x="65" y="394" fill="#1d394c" font-family="Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">4. Выход годных единиц, маркировка и КИЗ</text><rect x="46" y="434" width="1019" height="59" rx="11" fill="white" stroke="#d5e4ee"/><text x="65" y="473" fill="#1d394c" font-family="Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">5. Формирование коробов, FBO и передача</text><rect x="46" y="513" width="1019" height="59" rx="11" fill="white" stroke="#d5e4ee"/><text x="65" y="552" fill="#1d394c" font-family="Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">6. График и документ готовности всей партии</text><text x="48" y="660" fill="#785b42" font-family="Arial, sans-serif" font-size="20" font-weight="600" text-anchor="start">72 часа — модельный запрос клиента, а не публично подтвержденное SLA.</text></svg>
